<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142238">
  <title>SSJ Bank | Banca virtual</title>
  <link rel="stylesheet" href="/estilos.css?v=ssj-2">
  <script src="/configuracion.js"></script>
  <script src="/interfaz.js?v=ssj-2" defer></script>
</head>
<body>
  <div id="app">
    <header class="topbar">

        </span>
        <span>SSJ<span class="brand-light"> Bank</span></span>
      </a>
      <span class="topbar-caption">Simulador bancario web</span>

    <main id="main" class="main-content" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" aria-live="assertive"></div>
